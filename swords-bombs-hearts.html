<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miecze, Bomby i Serduszka · TooWee</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3ff;color:#352549;font:16px system-ui,Arial}main{min-height:100vh;display:flex;flex-direction:column;padding:clamp(12px,2vw,28px);gap:14px;max-width:1500px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(20px,2.5vw,34px);margin:0;color:#7952a4}button{border:0;border-radius:12px;background:#7952ae;color:white;padding:12px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}input{border:1px solid #cab5dc;border-radius:9px;padding:10px;font:inherit;max-width:100%}.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 5px 20px #48346a10}.players{display:flex;flex-wrap:wrap;gap:12px}.player{padding:12px 16px;border:2px solid #e6d8f3;border-radius:15px;background:white;min-width:170px}.player.active{border-color:#8053bd;background:#f2eaff}.player.out{opacity:.45}.hearts{font-size:clamp(18px,2vw,28px);letter-spacing:2px}.board{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:clamp(5px,1vw,12px);flex:1;min-height:0}.tile{min-height:60px;background:linear-gradient(145deg,#8c66c3,#67439c);font-size:clamp(20px,3vw,42px);font-weight:800;aspect-ratio:1.4}.tile.revealed{background:#eee6f7;color:#37234f}.controls{display:flex;gap:10px;flex-wrap:wrap}.question{font-size:clamp(18px,2.2vw,26px);font-weight:650}.target{display:flex;gap:10px;flex-wrap:wrap}#message{font-size:18px;font-weight:600}.hidden{display:none!important}@media(max-width:700px){.tile{min-height:45px;aspect-ratio:1}.player{min-width:130px;padding:8px}.board{gap:5px}}
/* One-screen game layout: the board consumes only the remaining viewport height. */
html,body{width:100%;height:100%;overflow:hidden}
main{height:100dvh;min-height:0;max-width:none;overflow:hidden;gap:clamp(5px,.9vh,12px);padding:clamp(6px,1vh,12px)}
header{flex:0 0 auto;min-height:0}header h1{font-size:clamp(17px,2vw,27px)}
#play:not(.hidden){display:flex;flex-direction:column;flex:1;min-height:0;gap:clamp(4px,.8vh,10px);overflow:hidden}

#play>.panel h2{font-size:clamp(16px,2vw,23px);margin:0;grid-column:1}
#question{font-size:clamp(14px,1.8vw,22px);grid-column:1}
#answer,#controls,#targets{grid-column:2;grid-row:auto}
#message{margin:0;font-size:clamp(12px,1.4vw,16px);grid-column:1/-1}
.players{flex:0 0 auto;max-height:19vh;overflow:hidden;gap:6px;align-content:start}
.player{padding:5px 9px;min-width:110px;font-size:clamp(11px,1.3vw,15px)}
.hearts{font-size:clamp(12px,1.65vw,21px);letter-spacing:0;overflow-wrap:anywhere}
.board{flex:1 1 0;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,4),minmax(0,1fr));gap:clamp(3px,.7vh,8px);overflow:hidden}
.tile{min-width:0;min-height:0;width:100%;height:100%;aspect-ratio:auto;padding:0;border-radius:clamp(5px,1vw,12px);font-size:clamp(11px,min(2.5vw,3.5vh),36px)}
#setup{overflow:auto;max-height:calc(100dvh - 65px)}
@media(max-height:650px){header h1{font-size:18px}header button,#play button{padding:5px 9px;font-size:13px}.players{max-height:16vh}.player{padding:3px 6px}.hearts{font-size:13px}}

/* Reserve the same amount of room for prompts and sword targeting in every phase. */
#play>.panel{height:clamp(130px,20vh,190px);min-height:0;overflow:hidden;grid-template-rows:auto 1fr auto;align-content:start}
#play>.panel h2{grid-row:1;align-self:start}
#question{grid-row:2;align-self:center}

.board{align-content:stretch;justify-content:stretch}
@media(max-height:600px){#play>.panel{height:120px}.players{max-height:13vh}}
